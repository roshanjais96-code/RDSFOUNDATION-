<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDS FOUNDATION Membership Registration</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f0f4fa;
  color: #0b2d5c;
}

.container {
  max-width: 650px;
  margin: 20px auto;
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.12);
}

h1 {
  text-align: center;
  color: #0b2d5c;
  font-size: 27px;
}

.subtitle {
  text-align: center;
  color: #555;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #bbb;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  background: #0b2d5c;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #164783;
}

.consent {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: 18px;
  font-size: 14px;
}

.consent input {
  width: auto;
  margin-top: 3px;
}

.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: #666;
}
</style>
</head>

<body>

<div class="container">

<h1>RDS FOUNDATION</h1>
<p class="subtitle">Membership Registration Form</p>

<form action="https://formsubmit.co/roshankrjais@gmail.com"
method="POST"
enctype="multipart/form-data">

<input type="hidden" name="_subject"
value="New RDS FOUNDATION Membership Application">

<input type="hidden" name="_template" value="table">

<label>Full Name *</label>
<input type="text" name="Full Name" required>

<label>Father's Name *</label>
<input type="text" name="Father's Name" required>

<label>Mother's Name</label>
<input type="text" name="Mother's Name">

<label>Date of Birth *</label>
<input type="date" name="Date of Birth" required>

<label>Gender *</label>
<select name="Gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Mobile Number *</label>
<input type="tel" name="Mobile Number"
pattern="[0-9]{10}" maxlength="10"
placeholder="10-digit mobile number" required>

<label>Email Address *</label>
<input type="email" name="Email Address" required>

<label>Full Address *</label>
<textarea name="Full Address" required></textarea>

<label>Education *</label>
<select name="Education" required>
<option value="">Select Education</option>
<option>Class 10</option>
<option>Class 11</option>
<option>Class 12</option>
<option>Graduation</option>
<option>Post Graduation</option>
<option>Other</option>
</select>

<label>Why do you want to join RDS FOUNDATION? *</label>
<textarea name="Membership Purpose" required></textarea>

<label>Upload Passport Size Photo (JPG/PNG) *</label>
<input type="file" name="Passport Photo"
accept=".jpg,.jpeg,.png" required>

<div class="consent">
<input type="checkbox" name="Declaration"
value="I agree" required>
<span>I confirm that the information provided above is correct and I agree to the RDS FOUNDATION membership terms.</span>
</div>

<button type="submit">Submit Application</button>

</form>

<p class="footer">
© RDS FOUNDATION | Membership Registration
</p>

</div>

</body>
  </html>
