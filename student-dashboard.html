<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | RDS FOUNDATION</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f5fc;
      color: #18324b;
    }
    header {
      background: #0756a5;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main { max-width: 850px; margin: 25px auto; padding: 16px; }
    .welcome, .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 15px #173e6412;
    }
    .card h2 { color: #0756a5; }
    .card a {
      display: inline-block;
      color: #0756a5;
      margin-top: 8px;
    }
    button {
      background: #0756a5;
      color: white;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>RDS FOUNDATION</h1>
    <p>Student Dashboard</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome, Student!</h2>
      <p>You are logged in to your student dashboard.</p>
      <p id="userEmail">Checking account...</p>
      <button id="logoutBtn">Logout</button>
    </section>

    <section class="card">
      <h2>Study Material</h2>
      <p>Access your learning materials.</p>
      <a href="index.html">Visit Study Material</a>
    </section>

    <section class="card">
      <h2>Digital Learning</h2>
      <p>Explore educational videos and lessons.</p>
      <a href="index.html">Open Digital Learning</a>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signOut
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDWMj_VxgKZFd0XI6CcbNAnKorzU56Sy8I",
      authDomain: "rds-foundation.firebaseapp.com",
      projectId: "rds-foundation",
      storageBucket: "rds-foundation.firebasestorage.app",
      messagingSenderId: "904509564072",
      appId: "1:904509564072:web:54fb399f27157429264e9d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      document.getElementById("userEmail").textContent = user.email;
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
